# Builds every platform in the cloud. Push to GitHub, open the Actions tab,
# and download the installers from the run's "Artifacts" section.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  # Override the project .npmrc cache path on CI runners.
  npm_config_cache: ${{ github.workspace }}/../npm-cache

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: npx electron-builder --mac --publish never
            files: |
              dist/desktop/*.dmg
              dist/desktop/*.zip
          - os: windows-latest
            cmd: npx electron-builder --win --publish never
            files: dist/desktop/*.exe
          - os: ubuntu-latest
            cmd: npx electron-builder --linux --publish never
            files: |
              dist/desktop/*.AppImage
              dist/desktop/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.cmd }}
      - uses: actions/upload-artifact@v4
        with:
          name: TalkPrompter-${{ runner.os }}
          path: ${{ matrix.files }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-artifact@v4
        with:
          name: TalkPrompter-web
          path: dist/web

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run mobile:sync
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TalkPrompter-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
